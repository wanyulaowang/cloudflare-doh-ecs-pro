name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify and audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --registry=https://registry.npmjs.org

      - name: Type-check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Audit dependencies
        run: npm audit --registry=https://registry.npmjs.org

      - name: Verify Workers packaging
        run: npm run deploy:dry-run
